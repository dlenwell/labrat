[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "labrat"
version = "0.5.4"
description = "LabRat — know what's lurking in your lab."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.1,<4",
    "gunicorn>=27.0.1,<28",
    "SQLAlchemy>=2.1.8,<3",
    "alembic>=1.20.1,<2",
    "argon2-cffi>=25.1.0,<26",
    "cryptography>=50,<51",
    "pysnmp>=7.1.32,<8",
    "requests>=2.31,<3",
    "tomlkit>=0.15.2,<1",
]

[project.optional-dependencies]
test = ["coverage>=7.6,<8"]

[tool.coverage.run]
branch = true
source = ["labrat"]

[tool.coverage.report]
fail_under = 90
precision = 1
show_missing = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
labrat = [
    "*.toml",
    "templates/*.html",
    "templates/public/*.html",
    "templates/private/*.html",
    "templates/docs/*.html",
    "templates/startup/*.html",
    "static/css/*.css",
    "static/js/*.js",
    "static/img/*",
    "static/img/docs/*",
    "static/fonts/*",
    "collector/profiles/*.json",
]
