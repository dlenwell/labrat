<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 52" aria-hidden="true">
  <!--
    A flash of light on the header rat's sunglasses (rat-peek-right.svg):
    both lenses in the same place as the head, filled bright, with a small
    four-point sparkle on the near lens. The header lays it exactly over the
    head and reveals it with a moving mask while he leans out, so a glimmer
    sweeps across the glasses (main.css section 03). rat-glint.svg without
    the mirror.
  -->
  <defs>
    <linearGradient id="glint-shine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#b9fff0"/>
      <stop offset="1" stop-color="#55d8e8"/>
    </linearGradient>
  </defs>
  <g>
    <path d="M27.4 26.6c.3-1.1 1.2-1.7 2.3-1.6l9.6.7c1.2.1 2 1.2 1.7 2.4l-1.2 4.8c-.5 2-2.3 3.3-4.3 3.2l-4.4-.3c-2.4-.2-4.1-2.4-3.7-4.8z" fill="url(#glint-shine)" opacity="0.85"/>
    <path d="M43.6 27.4c.2-.7.8-1 1.5-.9l3 .5c.7.1 1.1.8.9 1.5l-.9 3c-.3 1-1.3 1.6-2.3 1.4l-.9-.2c-1.2-.3-1.9-1.4-1.7-2.6z" fill="url(#glint-shine)" opacity="0.7"/>
    <!-- Sparkle at the near lens's upper corner. -->
    <path d="M38.6 22.4l.7 2.6 2.6.7-2.6.7-.7 2.6-.7-2.6-2.6-.7 2.6-.7z" fill="#ffffff"/>
  </g>
</svg>
